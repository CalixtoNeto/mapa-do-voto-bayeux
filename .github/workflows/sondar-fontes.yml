name: Sondar fontes do perfil

# Só lê e imprime no log: a API do SAPL da Câmara de Bayeux e o portal de dados abertos do TCE-PB (Sagres).
# Serve para escrever as fontes do perfil dos políticos com os campos reais; o ambiente de desenvolvimento não alcança esses sites.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sondar-fontes.yml']

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conjuntos do TCE-PB e arquivos de Bayeux
        continue-on-error: true
        run: |
          base=https://dados-abertos.tce.pb.gov.br
          js=$(curl -sSL -m 60 "$base/" | grep -oE 'src="[^"]+\.js"' | sed 's/^src="//;s/"$//' | head -1)
          curl -sSL -m 60 -o app.js "$base$js"
          node -e '
            const t = require("fs").readFileSync("app.js", "utf8");
            const trechos = (alvo, antes, depois, max = 3) => {
              let i = -1, n = 0;
              while ((i = t.indexOf(alvo, i + 1)) >= 0 && n++ < max)
                console.log(`\n--- ${alvo} @${i}\n` + t.slice(Math.max(0, i - antes), i + depois));
            };
            trechos("dados-por-municipio", 2500, 800, 2);
            trechos("dados-consolidados/", 1500, 300, 1);
            trechos("Bayeux", 300, 300, 3);
            trechos("BAYEUX", 300, 300, 3);
            const ids = [...new Set([...t.matchAll(/id:"([a-z0-9_-]{3,60})"/gi)].map(m => m[1]))];
            console.log("\n--- ids", ids.length, ids.join(" "));
          '
