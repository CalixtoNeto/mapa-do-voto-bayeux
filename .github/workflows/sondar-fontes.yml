name: Sondar fontes do perfil

# Só lê e imprime no log: a API do SAPL da Câmara de Bayeux e o portal de dados abertos do TCE-PB (Sagres).
# Serve para escrever as fontes do perfil dos políticos com os campos reais; o ambiente de desenvolvimento não alcança esses sites.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sondar-fontes.yml']

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Arquivos do TCE-PB de Bayeux (município 025)
        continue-on-error: true
        run: |
          for conjunto in despesas servidores receitas licitacoes; do
            for ano in 2025 2024; do
              url=https://download.tce.pb.gov.br/dados-abertos/dados-por-municipio/025/$conjunto/$conjunto-$ano.zip
              echo "::group::$conjunto $ano"
              curl -sSL -m 600 -o a.zip -w 'HTTP %{http_code} %{size_download} bytes\n' "$url"
              unzip -l a.zip | head -15
              for f in $(unzip -Z1 a.zip | head -4); do
                echo "== $f"
                unzip -p a.zip "$f" | head -c 3000000 | iconv -f "$(unzip -p a.zip "$f" | head -c 20000 | file -b --mime-encoding - | sed 's/unknown-8bit/ISO-8859-1/;s/binary/ISO-8859-1/')" -t UTF-8 \
                  | awk 'NR<=4 {print} NR>4 && tolower($0) ~ /c[aâ]mara|vereador|prefeit/ {print; if (++n == 6) exit}'
                echo "linhas: $(unzip -p a.zip "$f" | wc -l)"
              done
              echo "::endgroup::"
              [ "$(stat -c%s a.zip 2>/dev/null || echo 0)" -gt 1000 ] && break
            done
          done
