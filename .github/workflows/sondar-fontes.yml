name: Sondar fontes do perfil

# Só lê e imprime no log: a API do SAPL da Câmara de Bayeux e o portal de dados abertos do TCE-PB (Sagres).
# Serve para escrever as fontes do perfil dos políticos com os campos reais; o ambiente de desenvolvimento não alcança esses sites.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sondar-fontes.yml']

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conjuntos do TCE-PB e arquivos de Bayeux
        continue-on-error: true
        run: |
          base=https://dados-abertos.tce.pb.gov.br
          js=$(curl -sSL -m 60 "$base/" | grep -oE 'src="[^"]+\.js"' | sed 's/^src="//;s/"$//' | head -1)
          curl -sSL -m 60 -o app.js "$base$js"
          echo "::group::em volta dos downloads"
          grep -oE '.{0,1500}download\.tce\.pb\.gov\.br/dados-abertos/dados-por-municipio.{0,600}' app.js | head -c 5000; echo
          echo "::endgroup::"
          echo "::group::listas de conjuntos (id:)"
          grep -oE 'id:"[a-z0-9_-]{3,60}"[^}]{0,200}' app.js | sort -u | head -120
          echo "::endgroup::"
          echo "::group::bayeux no script"
          grep -oiE '.{0,200}bayeux.{0,200}' app.js | head -5
          echo "::endgroup::"
          echo "::group::JSON de apoio"
          grep -oE '"[^"]{0,120}\.json"|`[^`]{0,160}\.json`' app.js | sort -u | head -20
          echo "::endgroup::"
