name: Sondar fontes do perfil

# Só lê e imprime no log: a API do SAPL da Câmara de Bayeux e o portal de dados abertos do TCE-PB (Sagres).
# Serve para escrever as fontes do perfil dos políticos com os campos reais; o ambiente de desenvolvimento não alcança esses sites.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sondar-fontes.yml']

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SAPL da Câmara de Bayeux
        continue-on-error: true
        run: |
          api=https://sapl.bayeux.pb.leg.br/api
          mostrar() { echo "::group::$1"; curl -sSL -m 60 -A 'Mozilla/5.0' -H 'Accept: application/json' "$api/$1" | head -c 2500; echo; echo "::endgroup::"; }
          for caminho in '' 'parlamentares/parlamentar/?page_size=3' 'parlamentares/legislatura/' 'parlamentares/mandato/?page_size=3' \
              'parlamentares/filiacao/?page_size=2' 'sessao/sessaoplenaria/?page_size=2' 'sessao/sessaoplenariapresenca/?page_size=3' \
              'sessao/presencaordemdia/?page_size=3' 'sessao/registrovotacao/?page_size=2' 'sessao/votoparlamentar/?page_size=3' \
              'sessao/ordemdia/?page_size=2' 'materia/materialegislativa/?page_size=2' 'materia/autoria/?page_size=3' \
              'materia/tipomaterialegislativa/' 'base/autor/?page_size=3'; do
            mostrar "$caminho"
          done

      - name: Portal de dados abertos do TCE-PB
        continue-on-error: true
        run: |
          curl -sSL -m 60 -A 'Mozilla/5.0' -o tce.html -w 'HTTP %{http_code} -> %{url_effective}\n' https://dados-abertos.tce.pb.gov.br/
          echo "::group::html"; head -c 4000 tce.html; echo; echo "::endgroup::"
          echo "::group::links e scripts"
          grep -oiE '(href|src|action)="[^"]+"' tce.html | sort -u | head -120
          echo "::endgroup::"
          for js in $(grep -oiE 'src="[^"]+\.js[^"]*"' tce.html | sed 's/^src="//;s/"$//' | head -8); do
            case "$js" in http*) url=$js;; /*) url=https://dados-abertos.tce.pb.gov.br$js;; *) url=https://dados-abertos.tce.pb.gov.br/$js;; esac
            echo "::group::$url"
            curl -sSL -m 60 "$url" | grep -oE '"(/|https?://)[^"]{3,120}"' | grep -iE 'api|dados|download|arquivo|sagres|\.(gz|zip|csv)' | sort -u | head -60
            echo "::endgroup::"
          done
          for caminho in api api/ api/arquivos download downloads arquivos sagres municipal; do
            echo "$(curl -sS -o /dev/null -m 30 -w '%{http_code} %{content_type}' https://dados-abertos.tce.pb.gov.br/$caminho) /$caminho"
          done
