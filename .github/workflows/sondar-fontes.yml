name: Sondar fontes do perfil

# Só lê e imprime no log: a API do SAPL da Câmara de Bayeux e o portal de dados abertos do TCE-PB (Sagres).
# Serve para escrever as fontes do perfil dos políticos com os campos reais; o ambiente de desenvolvimento não alcança esses sites.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sondar-fontes.yml']

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Onde o portal do TCE-PB busca os dados
        continue-on-error: true
        run: |
          base=https://dados-abertos.tce.pb.gov.br
          js=$(curl -sSL -m 60 "$base/" | grep -oE 'src="[^"]+\.js"' | sed 's/^src="//;s/"$//' | head -1)
          curl -sSL -m 60 -o app.js "$base$js"
          echo "::group::endereços no script"
          grep -oE '"https?://[^"]{4,200}"' app.js | sort -u | head -80
          grep -oE '`[^`]{0,40}(api|https?:)[^`]{0,160}`' app.js | sort -u | head -80
          echo "::endgroup::"
          echo "::group::trechos com fetch/axios/baseURL"
          grep -oE '.{0,160}(fetch\(|baseURL|axios\.|\.get\(`).{0,200}' app.js | head -40
          echo "::endgroup::"
          echo "::group::arquivos e chunks importados"
          grep -oE '"(\./|/assets/)[^"]+\.js"' app.js | sort -u | head -40
          grep -oE '"[^"]{0,80}\.(zip|gz|csv|json)"' app.js | sort -u | head -40
          echo "::endgroup::"
